name: workplace-booking-prod

x-common-env: &common-env
  INTERNAL_API_KEY: ${INTERNAL_API_KEY:?Set INTERNAL_API_KEY in .env.prod}
  NATS_URL: nats://nats:4222
  INTERNAL_RPC_ENABLED: 'true'
  PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:?Set the canonical public HTTP(S) origin}
  USERS_URL: http://users:8000
  PYTHONDONTWRITEBYTECODE: '1'

x-users-env: &users-env
  <<: *common-env
  MCP_ENCRYPTION_KEY: ${MCP_ENCRYPTION_KEY:?Set a persistent MCP client encryption key with at least 32 characters}
  MCP_ACCESS_TTL_SECONDS: ${MCP_ACCESS_TTL_SECONDS:-600}
  MCP_REFRESH_DAYS: ${MCP_REFRESH_DAYS:-30}
  WEB_JWT_SECRET: ${WEB_JWT_SECRET:?Set WEB_JWT_SECRET with at least 32 characters}
  DATABASE_URL: postgresql+asyncpg://workplace_users@postgres:5432/users
  DATABASE_PASSWORD: ${USERS_DB_PASSWORD:?Set USERS_DB_PASSWORD}

x-booking-env: &booking-env
  <<: *common-env
  DATABASE_URL: postgresql+asyncpg://workplace_booking@postgres:5432/booking
  DATABASE_PASSWORD: ${BOOKING_DB_PASSWORD:?Set BOOKING_DB_PASSWORD}
  BOOKING_STEP_MINUTES: ${BOOKING_STEP_MINUTES:-5}
  BOOKING_HORIZON_DAYS: ${BOOKING_HORIZON_DAYS:-7}

x-assistant-env: &assistant-env
  <<: *common-env
  DATABASE_URL: postgresql+asyncpg://workplace_assistant@postgres:5432/assistant
  DATABASE_PASSWORD: ${ASSISTANT_DB_PASSWORD:?Set ASSISTANT_DB_PASSWORD}
  OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
  OPENROUTER_MODEL: ${OPENROUTER_MODEL:-}
  MCP_URL: http://gateway:8000/mcp

x-runtime: &runtime
  init: true
  restart: unless-stopped
  read_only: true
  tmpfs: [/tmp]
  security_opt: [no-new-privileges:true]
  cap_drop: [ALL]
  networks: [backend, egress]
  logging:
    driver: json-file
    options: { max-size: '10m', max-file: '3' }

x-api: &api
  <<: *runtime
  healthcheck:
    test:
      [
        CMD,
        python,
        -c,
        "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=10)",
      ]
    interval: 15s
    timeout: 12s
    retries: 5
    start_period: 20s

x-users-image: &users-image
  image: workplace-users:${IMAGE_TAG:-local}
  build:
    context: .
    target: production
    args: { SERVICE_PACKAGE: workplace-users, APP_MODULE: 'workplace_users.main:app' }

x-booking-image: &booking-image
  image: workplace-booking:${IMAGE_TAG:-local}
  build:
    context: .
    target: production
    args: { SERVICE_PACKAGE: workplace-booking-service, APP_MODULE: 'workplace_booking.main:app' }

x-assistant-image: &assistant-image
  image: workplace-assistant:${IMAGE_TAG:-local}
  build:
    context: .
    target: production
    args: { SERVICE_PACKAGE: workplace-assistant, APP_MODULE: 'workplace_assistant.main:app' }

services:
  nginx:
    image: workplace-frontend:${IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: infra/frontend.Dockerfile
      target: production
    init: true
    restart: unless-stopped
    ports:
      - '${HTTP_BIND:-127.0.0.1}:${HTTP_PORT:-8080}:8080'
    # A non-internal network is required for Docker's published host port.
    networks: [backend, egress]
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, 'http://127.0.0.1:8080/health']
      interval: 15s
      timeout: 3s
      retries: 5
    depends_on:
      gateway: { condition: service_healthy }

  postgres:
    image: postgres:17-bookworm
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      USERS_DB_PASSWORD: ${USERS_DB_PASSWORD:?Set USERS_DB_PASSWORD}
      BOOKING_DB_PASSWORD: ${BOOKING_DB_PASSWORD:?Set BOOKING_DB_PASSWORD}
      ASSISTANT_DB_PASSWORD: ${ASSISTANT_DB_PASSWORD:?Set ASSISTANT_DB_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/init-databases.sh:/docker-entrypoint-initdb.d/10-databases.sh:ro
    networks: [backend]
    restart: unless-stopped
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U postgres -d postgres']
      interval: 5s
      timeout: 3s
      retries: 20

  nats:
    image: nats:2.11-alpine
    command: [-c, /etc/nats/nats.conf]
    volumes:
      - nats-data:/data
      - ./infra/nats/nats.conf:/etc/nats/nats.conf:ro
    networks: [backend]
    restart: unless-stopped
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, 'http://127.0.0.1:8222/healthz?js-enabled-only=true']
      interval: 5s
      timeout: 3s
      retries: 20

  users-migrate:
    <<: [*users-image, *runtime]
    restart: 'no'
    environment: *users-env
    command: [alembic, -c, apps/users/alembic.ini, upgrade, head]
    depends_on:
      postgres: { condition: service_healthy }

  booking-migrate:
    <<: [*booking-image, *runtime]
    restart: 'no'
    environment: *booking-env
    command: [alembic, -c, apps/booking/alembic.ini, upgrade, head]
    depends_on:
      postgres: { condition: service_healthy }

  assistant-migrate:
    <<: [*assistant-image, *runtime]
    restart: 'no'
    environment: *assistant-env
    command: [alembic, -c, apps/assistant/alembic.ini, upgrade, head]
    depends_on:
      postgres: { condition: service_healthy }

  users:
    <<: [*users-image, *api]
    environment: *users-env
    depends_on:
      users-migrate: { condition: service_completed_successfully }
      nats: { condition: service_healthy }

  booking:
    <<: [*booking-image, *api]
    environment: *booking-env
    depends_on:
      booking-migrate: { condition: service_completed_successfully }
      nats: { condition: service_healthy }

  assistant:
    <<: [*assistant-image, *api]
    environment: *assistant-env
    depends_on:
      assistant-migrate: { condition: service_completed_successfully }
      nats: { condition: service_healthy }

  gateway:
    <<: *api
    image: workplace-gateway:${IMAGE_TAG:-local}
    build:
      context: .
      target: production
      args: { SERVICE_PACKAGE: workplace-gateway, APP_MODULE: 'workplace_gateway.main:app' }
    environment:
      <<: *common-env
      BOOKING_URL: http://booking:8000
      WEB_JWT_SECRET: ${WEB_JWT_SECRET:?Set WEB_JWT_SECRET with at least 32 characters}
      ASSISTANT_URL: http://assistant:8000
      COOKIE_SECURE: 'true'
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:?Set ALLOWED_ORIGINS as a JSON array of public HTTPS origins}
    depends_on:
      users: { condition: service_healthy }
      booking: { condition: service_healthy }

  users-outbox:
    <<: [*users-image, *runtime]
    environment: *users-env
    command: [python, -m, workplace_platform.outbox]
    depends_on:
      users-migrate: { condition: service_completed_successfully }
      nats: { condition: service_healthy }

  users-booking-events:
    <<: [*users-image, *runtime]
    environment: *users-env
    command: [python, -m, workplace_users.booking_events]
    depends_on:
      users-migrate: { condition: service_completed_successfully }
      nats: { condition: service_healthy }

  booking-outbox:
    <<: [*booking-image, *runtime]
    environment: *booking-env
    command: [python, -m, workplace_platform.outbox]
    depends_on:
      booking-migrate: { condition: service_completed_successfully }
      nats: { condition: service_healthy }

  assistant-outbox:
    <<: [*assistant-image, *runtime]
    environment: *assistant-env
    command: [python, -m, workplace_platform.outbox]
    depends_on:
      assistant-migrate: { condition: service_completed_successfully }
      nats: { condition: service_healthy }

  booking-user-events:
    <<: [*booking-image, *runtime]
    environment: *booking-env
    command: [python, -m, workplace_booking.user_events]
    depends_on:
      booking-migrate: { condition: service_completed_successfully }
      nats: { condition: service_healthy }

  assistant-booking-events:
    <<: [*assistant-image, *runtime]
    environment: *assistant-env
    command: [python, -m, workplace_assistant.booking_events]
    depends_on:
      assistant-migrate: { condition: service_completed_successfully }
      nats: { condition: service_healthy }

  assistant-generations:
    <<: [*assistant-image, *runtime]
    environment: *assistant-env
    command: [python, -m, workplace_assistant.generation_worker]
    depends_on:
      assistant-migrate: { condition: service_completed_successfully }
      users: { condition: service_healthy }
      nats: { condition: service_healthy }

  bootstrap:
    <<: [*users-image, *runtime]
    profiles: [tools]
    restart: 'no'
    environment:
      <<: *users-env
      BOOTSTRAP_ADMIN_LOGIN: ${BOOTSTRAP_ADMIN_LOGIN:-admin}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
      BOOTSTRAP_ADMIN_FIRST_NAME: ${BOOTSTRAP_ADMIN_FIRST_NAME:-Администратор}
      BOOTSTRAP_ADMIN_LAST_NAME: ${BOOTSTRAP_ADMIN_LAST_NAME:-Офиса}
    command: [python, -m, workplace_users.bootstrap]
    depends_on:
      users-migrate: { condition: service_completed_successfully }

networks:
  backend:
    internal: true
  # Application processes can reach OpenRouter; PostgreSQL/NATS have no external ports or egress.
  egress:

volumes:
  postgres-data:
  nats-data:
