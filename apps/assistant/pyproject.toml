[project]
name = "workplace-assistant"
version = "0.1.0"
description = "Assistant API and conversation storage for Workplace Booking"
requires-python = ">=3.12"
dependencies = [
  "workplace-platform",
  "pydantic-ai-slim[mcp,openrouter]>=2.68,<3",
  "httpx2>=2.16,<3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/workplace_assistant"]

[tool.uv.sources]
workplace-platform = { workspace = true }
