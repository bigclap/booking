[project]
name = "workplace-gateway"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = ["workplace-platform", "mcp>=2.3,<3"]

[tool.uv.sources]
workplace-platform = { workspace = true }

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/workplace_gateway"]
