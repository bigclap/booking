[project]
name = "workplace-booking-service"
version = "0.1.0"
description = "Office catalog and booking domain service"
requires-python = ">=3.12"
dependencies = ["workplace-platform"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/workplace_booking"]

[tool.uv.sources]
workplace-platform = { workspace = true }
