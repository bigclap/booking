[project]
name = "workplace-backend"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = []

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/*", "apps/users", "apps/booking", "apps/assistant", "apps/gateway"]

[tool.uv.sources]
workplace-platform = { workspace = true }

[dependency-groups]
dev = ["pytest>=8.3,<9", "pytest-asyncio>=0.25,<2", "ruff>=0.11,<1"]

[tool.pytest.ini_options]
testpaths = [
    "packages/platform/tests",
    "apps/users/tests",
    "apps/booking/tests",
    "apps/assistant/tests",
    "apps/gateway/tests",
]
asyncio_mode = "auto"
addopts = "-p no:cacheprovider --import-mode=importlib"
markers = ["integration: needs the isolated PostgreSQL and NATS test stack"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
# FastAPI dependencies are evaluated by the framework.
"**/routes.py" = ["B008"]
